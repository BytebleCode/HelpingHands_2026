# Helping Hands for Apache httpd / IBM HTTP Server on z/OS.
# The site's rules live in its .htaccess; this file loads the module they need and lets them apply.
# Add to httpd.conf, with the path to your checkout:
#
#   Define HH_ROOT /u/youruser/HelpingHands_2026
#   Include /u/youruser/HelpingHands_2026/apache/helping-hands.conf
#
# Then open http://<host>:<port>/helping-hands/ . If the checkout is already inside your
# DocumentRoot, you only need the LoadModule line and AllowOverride for that folder.

# Remove this line if mod_charset_lite is already loaded.
LoadModule charset_lite_module modules/mod_charset_lite.so

Alias /helping-hands "${HH_ROOT}"
<Directory "${HH_ROOT}">
    AllowOverride FileInfo Indexes
    Require all granted
</Directory>
