# Helping Hands, served as a static site by Apache httpd / IBM HTTP Server on z/OS.
# Include this from httpd.conf and set HH_ROOT to the client/dist folder of this checkout.
# The site must be at the root of its host: it requests /assets/..., /images/... and /api/....
#
#   Define HH_ROOT /u/youruser/HelpingHands_2026/client/dist
#   Include /u/youruser/HelpingHands_2026/apache/helping-hands.conf

LoadModule charset_lite_module modules/mod_charset_lite.so

Listen 8080
<VirtualHost *:8080>
    DocumentRoot "${HH_ROOT}"

    <Directory "${HH_ROOT}">
        Require all granted
        Options -Indexes
        # Client-side routes (/rewards, /give, ...) all load the app shell.
        FallbackResource /index.html
    </Directory>

    # Frozen API snapshots: a missing file is a real 404, not the app shell.
    <Location "/api/">
        FallbackResource disabled
    </Location>

    AddType application/json .json
    AddType application/manifest+json .webmanifest
    AddType font/woff2 .woff2
    AddType font/woff .woff

    # Text files are stored in EBCDIC (IBM-1047); browsers need ASCII. Convert text only:
    # images and fonts are binary and must go out unchanged.
    <FilesMatch "\.(html|js|css|json|svg|webmanifest|md)$">
        CharsetSourceEnc IBM-1047
        CharsetDefault ISO8859-1
    </FilesMatch>

    # Bundled assets have content hashes in their names, so they can be cached for a long time.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
